name: Core Security Intelligence

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-posture:
    name: Update Core Security Posture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Security Telemetry Engine
        run: python3 scripts/update_security_posture.py

      - name: Commit updated SECURITY.md if metrics changed
        run: |
          if ! git diff --quiet SECURITY.md || [ -z "$(git ls-files SECURITY.md)" ]; then
            git config user.name "octo-security-bot"
            git config user.email "security-bot@users.noreply.github.com"
            git add SECURITY.md
            git commit -m "update live core security posture [skip ci]"
            git push
          fi
