site_name: Django-Octo Ecosystem
site_url: https://django-octo.readthedocs.io/en/latest/
repo_url: https://github.com/jeanpmodev/django_octo

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview (Core): index.md
  - Aurora (Topology): aurora.md
  - SEO: seo.md
  - Security: security.md
  - UML: uml.md
  - QA: qa.md
