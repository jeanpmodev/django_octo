site_name: Django-Octo Ecosystem
site_url: https://django-octo.readthedocs.io/en/latest/
repo_url: https://github.com/jeanpmodev/django_octo
repo_name: jeanpmodev/django_octo

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - toc.follow
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - toc:
      toc_depth: 2
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Overview: index.md
  - Aurora: aurora.md
  - SEO: seo.md
  - Security: security.md
  - UML: uml.md
  - QA: qa.md
