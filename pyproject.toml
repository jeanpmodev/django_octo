[project]
name = "django-octo"
version = "0.1.8"
description = "Enterprise Django-Octo Core Orchestrator unifying SEO, Security, and Dual-Channel runtime modules."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jean Carlos", email = "jeanpmodev@gmail.com" }]
dependencies = [
    "django>=6.1.2",
    "django-octo-seo>=0.1.6",
    "django-octo-security>=0.1.0",
]

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/django_octo"]

[tool.rye]
dev-dependencies = [
    "pytest>=9.2.0",
]
