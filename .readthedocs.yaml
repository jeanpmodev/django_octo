version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - pip install mkdocs mkdocs-material
    pre_build:
      - mkdir -p docs
      - cp README.md docs/index.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_aurora/main/README.md -o docs/aurora.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_seo/main/README.md -o docs/seo.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_security/main/README.md -o docs/security.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_uml/main/README.md -o docs/uml.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_qa/main/README.md -o docs/qa.md
      - python -c "import pathlib, re; repos = {'index.md': ('django_octo', 'Django-Octo Core Orchestrator'), 'aurora.md': ('django_octo_aurora', 'Django-Octo Aurora'), 'seo.md': ('django_octo_seo', 'Django-Octo SEO'), 'security.md': ('django_octo_security', 'Django-Octo Security'), 'uml.md': ('django_octo_uml', 'Django-Octo UML'), 'qa.md': ('django_octo_qa', 'Django-Octo QA')}; [pathlib.Path('docs', f).write_text(re.sub(r'(?ms)\x60\x60\x60mermaid\s*(.*?)\s*\x60\x60\x60', r'\n\n<div class=\"mermaid\">\n\1\n</div>\n\n', re.sub(r'^#{1,2}\s+.*pypi library package.*$', f'# {t}', pathlib.Path('docs', f).read_text(encoding='utf-8').replace('(TESTING.md)', f'(https://github.com/jeanpmodev/{r}/blob/main/TESTING.md)').replace('(LICENSE)', f'(https://github.com/jeanpmodev/{r}/blob/main/LICENSE)'), count=1, flags=re.IGNORECASE | re.MULTILINE)), encoding='utf-8') for f, (r, t) in repos.items()]"

mkdocs:
  configuration: mkdocs.yml
