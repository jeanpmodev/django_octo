version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - pip install mkdocs mkdocs-material
    pre_build:
      - mkdir -p docs
      - cp README.md docs/index.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_aurora/main/README.md -o docs/aurora.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_seo/main/README.md -o docs/seo.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_security/main/README.md -o docs/security.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_uml/main/README.md -o docs/uml.md
      - curl -fsSL https://raw.githubusercontent.com/jeanpmodev/django_octo_qa/main/README.md -o docs/qa.md
      - |
        python - << 'EOF'
        import pathlib
        import re

        repos = {
            "index.md": ("django_octo", "Django-Octo Core Orchestrator"),
            "aurora.md": ("django_octo_aurora", "Django-Octo Aurora"),
            "seo.md": ("django_octo_seo", "Django-Octo SEO"),
            "security.md": ("django_octo_security", "Django-Octo Security"),
            "uml.md": ("django_octo_uml", "Django-Octo UML"),
            "qa.md": ("django_octo_qa", "Django-Octo QA"),
        }

        for fname, (repo, clean_title) in repos.items():
            p = pathlib.Path("docs") / fname
            text = p.read_text(encoding="utf-8")
            base = f"https://github.com/jeanpmodev/{repo}/blob/main"
            text = text.replace("(TESTING.md)", f"({base}/TESTING.md)")
            text = text.replace("(LICENSE)", f"({base}/LICENSE)")
            text = re.sub(r"^#{1,2}\s+.*pypi library package.*$", f"# {clean_title}", text, count=1, flags=re.IGNORECASE | re.MULTILINE)
            text = re.sub(
                r"(?ms)```mermaid\s*(.*?)\s*```",
                lambda m: f'\n\n<pre class="mermaid"><code>{m.group(1).strip()}</code></pre>\n\n',
                text,
            )
            p.write_text(text, encoding="utf-8")
        EOF

mkdocs:
  configuration: mkdocs.yml
